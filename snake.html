<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хэллоуин Змейка</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a0b2e;
            background-image: 
                linear-gradient(45deg, rgba(255,255,255,0.03) 25%, transparent 25%), 
                linear-gradient(-45deg, rgba(255,255,255,0.03) 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.03) 75%), 
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.03) 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
            
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #f1f3f4;
            overflow: hidden;
        }
        .game-wrapper {
            text-align: center;
            background: #23113b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(138, 43, 226, 0.3);
            border: 2px solid #ff7518;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: bold;
            padding: 0 10px;
        }
        .score {
            color: #00ffc8;
        }
        .best-score {
            color: #ff7518;
        }
        canvas {
            background: #0d0614;
            border-radius: 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
            display: block;
            border: 1px solid #4a1e7a;
        }
        .controls-hint {
            margin-top: 15px;
            font-size: 13px;
            color: #b19cd9;
        }
        .game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 11, 46, 0.98);
            padding: 30px 50px;
            border-radius: 12px;
            border: 2px solid #ff4165;
            text-align: center;
            display: none;
            box-shadow: 0 0 30px rgba(255, 65, 101, 0.6);
        }
        .game-over-screen h2 {
            color: #ff4165;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255,65,101,0.5);
        }
        .game-over-screen p {
            color: #d1c4e9;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header">
            <div class="score">Счёт: <span id="currentScore">0</span></div>
            <div class="best-score">Рекорд: <span id="bestScore">0</span></div>
        </div>
        
        <div style="position: relative;">
            <canvas id="gameCanvas" width="500" height="500"></canvas>
            
            <div class="game-over-screen" id="gameOverScreen">
                <h2>ИГРА ОКОНЧЕНА</h2>
                <p>Нажмите <strong style="color: #ff7518;">ПРОБЕЛ</strong>, чтобы воскреснуть</p>
            </div>
        </div>

        <div class="controls-hint">
            Управление: Стрелки на клавиатуре или клавиши WASD
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const currentScoreEl = document.getElementById("currentScore");
        const bestScoreEl = document.getElementById("bestScore");
        const gameOverScreen = document.getElementById("gameOverScreen");

        const GRID = 25;
        const COUNT = canvas.width / GRID;

        let snake = [];
        let food = {};
        let dx = GRID;
        let dy = 0;
        let score = 0;
        let bestScore = localStorage.getItem("halloween_snake_best") || 0;
        let isGameOver = false;

        bestScoreEl.innerText = bestScore;

        function initGame() {
            snake = [
                {x: 5 * GRID, y: 5 * GRID},
                {x: 4 * GRID, y: 5 * GRID},
                {x: 3 * GRID, y: 5 * GRID}
            ];
            dx = GRID;
            dy = 0;
            score = 0;
            currentScoreEl.innerText = score;
            isGameOver = false;
            gameOverScreen.style.display = "none";
            spawnFood();
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * COUNT) * GRID,
                y: Math.floor(Math.random() * COUNT) * GRID
            };
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                }
            });
        }

        function main() {
            if (isGameOver) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                endGame();
                return;
            }

            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                currentScoreEl.innerText = score;
                if (score > bestScore) {
                    bestScore = score;
                    bestScoreEl.innerText = bestScore;
                    localStorage.setItem("halloween_snake_best", bestScore);
                }
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = "#0d0614";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
            ctx.lineWidth = 1;
            for (let i = 0; i <= canvas.width; i += GRID) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            ctx.fillStyle = "#00ff66";
            ctx.shadowColor = "#00ff66";
            ctx.shadowBlur = 10;
            ctx.fillRect(food.x + 4, food.y + 7, GRID - 8, GRID - 14);
            ctx.beginPath();
            ctx.arc(food.x + 3, food.y + GRID/2, 3, 0, Math.PI * 2);
            ctx.arc(food.x + GRID - 3, food.y + GRID/2, 3, 0, Math.PI * 2);
            ctx.fill();

            snake.forEach((part, index) => {
                if (index === 0) {
                    ctx.save();
                    ctx.translate(part.x + GRID / 2, part.y + GRID / 2);

                    if (dx > 0) ctx.rotate(0);
                    else if (dx < 0) ctx.rotate(Math.PI);
                    else if (dy > 0) ctx.rotate(Math.PI / 2);
                    else if (dy < 0) ctx.rotate(-Math.PI / 2);

                    ctx.fillStyle = "#ff7518";
                    ctx.shadowColor = "#ff7518";
                    ctx.shadowBlur = 12;
                    ctx.fillRect(-GRID / 2 + 1, -GRID / 2 + 1, GRID - 2, GRID - 2);

                    ctx.fillStyle = "#2ecc71";
                    ctx.fillRect(-2, -GRID / 2 - 2, 4, 4);

                    ctx.fillStyle = "#0d0614";
                    ctx.beginPath();
                    ctx.moveTo(-4, -8);
                    ctx.lineTo(2, -3);
                    ctx.lineTo(-4, -3);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(-4, 8);
                    ctx.lineTo(2, 3);
                    ctx.lineTo(-4, 3);
                    ctx.fill();

                    ctx.fillRect(4, -6, 3, 12);

                    ctx.restore();
                } else {
                    ctx.fillStyle = "#e65c00";
                    ctx.shadowColor = "transparent";
                    ctx.shadowBlur = 0;
                    ctx.fillRect(part.x + 2, part.y + 2, GRID - 4, GRID - 4);
                }
            });
            ctx.shadowBlur = 0;
        }

        function endGame() {
            isGameOver = true;
            gameOverScreen.style.display = "block";
        }

        document.addEventListener("keydown", e => {
            if (e.code === "Space" && isGameOver) {
                initGame();
                return;
            }

            if (isGameOver) return;

            if ((e.code === "ArrowUp" || e.code === "KeyW") && dy === 0) {
                dx = 0; dy = -GRID;
            } else if ((e.code === "ArrowDown" || e.code === "KeyS") && dy === 0) {
                dx = 0; dy = GRID;
            } else if ((e.code === "ArrowLeft" || e.code === "KeyA") && dx === 0) {
                dx = -GRID; dy = 0;
            } else if ((e.code === "ArrowRight" || e.code === "KeyD") && dx === 0) {
                dx = GRID; dy = 0;
            }
        });

        initGame();
        setInterval(main, 150);
    </script>
</body>
</html>
